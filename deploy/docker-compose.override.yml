# /docker/agent-stack/docker-compose.override.yml
# Loaded automatically together with docker-compose.yml.
# Unchanged from your current file: ollama, openviking (plus a backup label).
# New: kira-orb, backup. Added to existing services: OpenClaw memory limit, backup labels.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - agentnet

  openviking:
    image: ghcr.io/volcengine/openviking:latest
    restart: unless-stopped
    volumes:
      - ./openviking:/app/.openviking
    environment:
      OPENVIKING_PUBLIC_BASE_URL: https://viking.bigsixtech.tech
      OPENVIKING_WITH_BOT: "0"
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - agentnet
    depends_on:
      - ollama
    labels:
      - docker-volume-backup.stop-during-backup=true   # paused ~1 min nightly so the memory index copies cleanly

  # ---- additions to services defined in docker-compose.yml ----
  openclaw-gateway:
    mem_limit: 5g            # a runaway agent can't starve Caddy, the mailer or OpenViking
    labels:
      - docker-volume-backup.stop-during-backup=true

  n8n:
    labels:
      - docker-volume-backup.stop-during-backup=true

  mailer:
    labels:
      - docker-volume-backup.stop-during-backup=true

  # ---- new: voice front end ----
  kira-orb:
    build: ./kira-orb
    restart: unless-stopped
    env_file: ./kira-orb/.env
    networks: [agentnet]      # no published ports; Caddy reaches it as kira-orb:8080
    volumes:
      # The orb reads each agent's SOUL.md (full names) and saves attached files into that
      # agent's workspace inbox/. Its code only ever writes inside workspace*/inbox/.
      - ./data/openclaw:/openclaw
      # The orb's own device key (its approval in OpenClaw) and the conversation each agent is on.
      # Create it once, owned by the container's user: mkdir -p data/kira-orb && chown 1000:1000 data/kira-orb
      - ./data/kira-orb:/state
    depends_on:
      - openclaw-gateway

  # ---- new: Kyutai Pocket TTS voices (each agent speaks in its own cloned voice) ----
  voice:
    build: ./kira-orb/voice
    restart: unless-stopped
    networks: [agentnet]      # no published ports; only the orb talks to it
    env_file:
      - path: ./voice.env     # HF_TOKEN: the Pocket TTS weights are gated on Hugging Face (see README)
        required: false
    environment:
      TORCH_THREADS: "2"
      CLIP_SECONDS: "10"        # seconds of each voice clip used; longer = slower speech, 10 clones well
      # BUILTIN_VOICES: "scout=alba"   # optional: built-in Pocket TTS voices for agents without a clip
    volumes:
      - ./kira-orb/voices:/voices:ro    # one clip per agent, kept in the Orbis repo: main.mp3, forge.mp3, ledger.mp3
      - ./data/voice-cache:/cache       # downloaded model weights (kept out of backups)
    mem_limit: 1536m
    cpus: "2.0"

  # ---- new: nightly encrypted backup of the whole stack folder ----
  backup:
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    env_file: ./backup.env
    volumes:
      - /docker/agent-stack:/backup/agent-stack:ro
      - /root/backups:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro   # only so it can pause the labelled containers
